<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login</title>
</head>
<body>
  <h2>Área Restrita</h2>
  <input id="senha" type="password" placeholder="Digite a senha">
  <button onclick="login()">Entrar</button>

  <script>
    function login() {
      const senha = document.getElementById("senha").value;
      document.cookie = "auth=" + senha + "; path=/";
      window.location.href = "/";
    }
  </script>
</body>
</html>
