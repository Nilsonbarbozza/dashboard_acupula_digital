<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesse sua conta - Stripe</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind Utilities para a Página de Login Stripe -->
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f6f9fc;
      overflow-x: hidden;
    }
    
    /* Background Gradient Flow 
       Como um substituto leve e performático da faixa da Stripe */
    .bg-stripe {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      z-index: -1;
    }
    
    .bg-stripe::before {
      content: "";
      position: absolute;
      width: 150%;
      height: 150%;
      top: -25%;
      left: -25%;
      /* Cores aproximadas da marca (azul claro, laranja, rosa, roxo) */
      background: radial-gradient(circle at 10% 20%, rgba(216,236,252,1) 0%, rgba(216,236,252,0) 40%),
                  radial-gradient(circle at 80% 20%, rgba(255,152,0,0.4) 0%, rgba(255,152,0,0) 50%),
                  radial-gradient(circle at 70% 80%, rgba(233,30,99,0.3) 0%, rgba(233,30,99,0) 50%),
                  radial-gradient(circle at 30% 90%, rgba(156,39,176,0.3) 0%, rgba(156,39,176,0) 60%);
      transform: rotate(-15deg);
      filter: blur(80px);
    }

    .bg-stripe::after {
        content: "";
        position: absolute;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(135deg, rgba(246, 249, 252, 0.9) 0%, rgba(246, 249, 252, 0.4) 40%, rgba(246, 249, 252, 0) 100%);
        top: 0;
        left: 0;
    }
    
    .stripe-input {
      transition: all 0.2s ease-in-out;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
    
    .stripe-input:focus {
      outline: none;
      border-color: #6366f1; /* Indigo/Purpur */
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }
    
    .stripe-input.error {
      border-color: #ef4444; /* Vermelho */
      background-color: #fef2f2;
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
    }

    .stripe-btn {
      background-color: #635bff; /* Cor do botão primário do stripe */
      transition: background-color 0.15s ease, transform 0.05s ease;
    }
    
    .stripe-btn:hover {
      background-color: #0a2540;
    }
    
    .stripe-btn:active {
      transform: scale(0.98);
    }

    .stripe-btn-secondary {
      background-color: white;
      border: 1px solid #e2e8f0;
      color: #1a1f36;
      transition: background-color 0.15s ease;
    }

    .stripe-btn-secondary:hover {
      background-color: #f8fafc;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 lg:p-8 relative">
  <!-- Fundo -->
  <div class="bg-stripe"></div>

  <!-- Header Absoluto (Logo) -->
  <div class="absolute top-0 left-0 w-full p-6 sm:px-12 flex justify-start">
    <div class="font-bold text-2xl tracking-tighter text-[#0a2540]">stripe</div>
  </div>

  <!-- Main Container do Card -->
  <div class="w-full max-w-[480px] mt-6 z-10">
    
    <!-- Card Branco -->
    <div class="bg-white rounded-[16px] p-8 sm:p-10 pb-6 shadow-[0_50px_100px_-20px_rgba(50,50,93,0.25),0_30px_60px_-30px_rgba(0,0,0,0.3)] border border-gray-100">
      
      <h1 class="text-[#1a1f36] text-[24px] font-bold mb-8">Acesse sua conta</h1>
      
      <!-- Formulário -->
      <form id="loginForm" onsubmit="event.preventDefault(); authLogin();">
        
        <!-- Alerta de Erro (Oculto por Padrão) -->
        <div id="errorAlert" class="hidden mb-6 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-md text-sm flex items-start">
          <svg class="w-5 h-5 text-red-500 mr-2 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <span id="errorMsg">As credenciais fornecidas não conferem. Verifique o e-mail e a senha digitados.</span>
        </div>

        <!-- E-mail -->
        <div class="mb-5">
          <label for="email" class="block text-[14px] font-medium text-[#1a1f36] mb-1.5">E-mail</label>
          <input type="email" id="email" required placeholder="exemplo@empresa.com"
                 class="stripe-input w-full px-4 py-2.5 text-[#1a1f36] bg-white placeholder-gray-400 text-[15px]">
        </div>
        
        <!-- Senha -->
        <div class="mb-5">
          <div class="flex items-center justify-between mb-1.5">
            <label for="senha" class="block text-[14px] font-medium text-[#1a1f36]">Senha</label>
            <a href="#" class="text-[#635bff] hover:text-[#0a2540] text-[13px] font-medium transition-colors">Esqueceu sua senha?</a>
          </div>
          <input type="password" id="senha" required placeholder="Digite sua senha"
                 class="stripe-input w-full px-4 py-2.5 text-[#1a1f36] bg-white placeholder-gray-400 text-[15px]">
        </div>
        
        <!-- Lembrar de mim -->
        <div class="flex items-center mb-8">
          <div class="relative flex items-start">
            <div class="flex h-5 items-center">
              <input id="lembrar" type="checkbox" required
                     class="h-4 w-4 rounded border-gray-300 text-[#635bff] focus:ring-[#635bff]">
            </div>
            <div class="ml-2.5 text-sm">
              <label for="lembrar" class="text-[#425466] font-medium text-[14px] cursor-pointer">Lembrar de mim neste dispositivo</label>
            </div>
          </div>
        </div>
        
        <!-- Botão Entrar -->
        <button type="submit" 
                class="stripe-btn w-full text-white font-semibold py-2.5 px-4 rounded-[6px] text-[15px] shadow-[0_2px_4px_rgba(0,0,0,0.1)]">
          Entrar
        </button>
      </form>
      
      <!-- Divisor -->
      <div class="relative my-7">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-200"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="bg-white px-3 text-xs font-semibold text-[#8792a2] tracking-wider uppercase">OU</span>
        </div>
      </div>
      
      <!-- Botões Secundários -->
      <div class="space-y-3">
        <button type="button" class="stripe-btn-secondary w-full py-2 px-4 rounded-[6px] font-semibold text-[14px] shadow-sm flex items-center justify-center">
          <svg class="h-4 w-4 mr-2" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Entrar com o Google
        </button>
        
        <button type="button" class="stripe-btn-secondary w-full py-2 px-4 rounded-[6px] font-semibold text-[14px] shadow-sm flex items-center justify-center">
          Fazer login com chave de acesso
        </button>
        
        <button type="button" class="stripe-btn-secondary w-full py-2 px-4 rounded-[6px] font-semibold text-[14px] shadow-sm flex items-center justify-center">
          Entrar com SSO
        </button>
      </div>
      
    </div>
    
    <!-- Link Abaixo do Card -->
    <div class="mt-6 text-center">
      <p class="text-[14px] text-[#425466]">
        Começando agora na Stripe? 
        <a href="#" class="text-[#635bff] hover:text-[#0a2540] font-medium transition-colors">Crie uma conta</a>
      </p>
    </div>
  </div>

  <!-- Rodapé Absoluto -->
  <div class="absolute bottom-0 left-0 w-full p-6 sm:px-12 flex items-center space-x-6">
    <span class="text-[13px] font-medium text-[#8792a2]">© Stripe</span>
    <a href="#" class="text-[13px] font-medium text-[#8792a2] hover:text-[#425466] transition-colors">Privacidade e termos</a>
  </div>

  <script>
    function authLogin() {
      const emailInput = document.getElementById("email");
      const senhaInput = document.getElementById("senha");
      const errorAlert = document.getElementById("errorAlert");
      
      const email = emailInput.value.trim();
      const senha = senhaInput.value;

      // Reset Styles
      emailInput.classList.remove("error");
      senhaInput.classList.remove("error");
      errorAlert.classList.add("hidden");

      // Credenciais Exigidas
      if (email === "acupuladigital@gmail.com" && senha === "raphaelli3332") {
        // Sucesso
        localStorage.setItem("autorizado", "true");
        // Animação leve no botão antes de sair
        const btn = document.querySelector('button[type="submit"]');
        btn.innerHTML = `
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Entrando...
        `;
        setTimeout(() => {
          window.location.href = "/index.html";
        }, 600);
      } else {
        // Falha
        emailInput.classList.add("error");
        senhaInput.classList.add("error");
        errorAlert.classList.remove("hidden");
        // Scroll p/ cima se estiver em mobile pequeno
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }
  </script>
</body>
</html>
